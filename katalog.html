<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aksessuarlar katalogi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f1f4f2;--card:#fff;--ink:#14201b;--mute:#62726b;--line:#dbe3df;--acc:#0b7a5b;--accink:#fff;--chip:#e3ebe7;box-sizing:border-box}
:root[data-theme="dark"]{--bg:#0f1714;--card:#17221e;--ink:#eaf2ee;--mute:#93a69d;--line:#26362f;--acc:#2fbf93;--accink:#06251b;--chip:#1f2e28}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.35;padding-bottom:96px}
header{padding:18px 16px 6px}
header h1{margin:0;font-size:24px;letter-spacing:-.2px}
header p{margin:4px 0 0;color:var(--mute);font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);color:var(--ink);padding:9px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--accink);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1/1;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:54px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.pb{padding:10px 11px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.pn{font-size:14px;font-weight:600}
.pp{font-size:15px;font-weight:800;color:var(--acc);margin-top:auto}
.add,.step button{border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
.add{background:var(--acc);color:var(--accink);padding:10px}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--chip);border-radius:10px}
.step button{background:transparent;color:var(--ink);width:44px;height:40px;font-size:20px}
.step b{min-width:24px;text-align:center}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:none}
.bar.on{display:block}
.go{width:100%;border:0;border-radius:14px;background:var(--acc);color:var(--accink);padding:15px;font:inherit;font-size:16px;font-weight:800;cursor:pointer}
.empty{padding:30px 16px;text-align:center;color:var(--mute)}
</style>
</head>
<body>
<header>
  <h1>Aksessuarlar</h1>
  <p>Zaryadka, naushnik, chexol, kabel. Tanlang va buyurtma bering.</p>
</header>
<div class="chips" id="chips" role="group" aria-label="Kategoriyalar"></div>
<div class="grid" id="grid"></div>
<div class="bar" id="bar"><button class="go" id="go" type="button"></button></div>

<script>
/* ===== MAHSULOTLAR: shu ro'yxatni o'zingizga moslab tahrirlang =====
   img: rasm fayli (repo'dagi img papkasida). Rasm bo'lmasa emoji ko'rinadi. */
var PRODUCTS = [
  {id:1, name:"Zaryadka 20W (Type-C)", cat:"Zaryadka", price:60000, img:"zaryadka.jpg", e:"🔌"},
  {id:2, name:"Kabel Type-C", cat:"Kabel", price:25000, img:"kabel.jpg", e:"🔗"},
  {id:3, name:"Kabel iPhone (Lightning)", cat:"Kabel", price:35000, img:"kabel-iphone.jpg", e:"🔗"},
  {id:4, name:"Simsiz naushnik", cat:"Naushnik", price:120000, img:"naushnik.jpg", e:"🎧"},
  {id:5, name:"Simli naushnik", cat:"Naushnik", price:30000, img:"naushnik-simli.jpg", e:"🎧"},
  {id:6, name:"G'ilof (chexol)", cat:"Chexol", price:40000, img:"chexol.jpg", e:"📱"},
  {id:7, name:"Himoya oynasi", cat:"Chexol", price:20000, img:"oyna.jpg", e:"🛡️"},
  {id:8, name:"Powerbank 10000 mAh", cat:"Zaryadka", price:150000, img:"powerbank.jpg", e:"🔋"}
];

var tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); if (tg.colorScheme === "dark") document.documentElement.setAttribute("data-theme","dark"); }
else if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.setAttribute("data-theme","dark");

var cart = {}, cat = "Hammasi";
var fmt = function(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " so'm"; };
var $ = function(id){ return document.getElementById(id); };

function renderChips(){
  var cats = ["Hammasi"]; PRODUCTS.forEach(function(p){ if (cats.indexOf(p.cat) < 0) cats.push(p.cat); });
  $("chips").innerHTML = "";
  cats.forEach(function(c){
    var b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = c;
    b.setAttribute("aria-pressed", c === cat);
    b.onclick = function(){ cat = c; renderChips(); renderGrid(); };
    $("chips").appendChild(b);
  });
}

function renderGrid(){
  var g = $("grid"); g.innerHTML = "";
  var list = PRODUCTS.filter(function(p){ return cat === "Hammasi" || p.cat === cat; });
  if (!list.length){ g.innerHTML = '<div class="empty">Bu bo\'limda hozircha mahsulot yo\'q.</div>'; return; }
  list.forEach(function(p){
    var d = document.createElement("div"); d.className = "p";
    var ph = document.createElement("div"); ph.className = "ph";
    var im = new Image(); im.alt = p.name; im.loading = "lazy"; im.src = "img/" + p.img;
    im.onerror = function(){ ph.textContent = p.e; };
    ph.appendChild(im);
    var pb = document.createElement("div"); pb.className = "pb";
    var n = document.createElement("div"); n.className = "pn"; n.textContent = p.name;
    var pr = document.createElement("div"); pr.className = "pp"; pr.textContent = fmt(p.price);
    pb.appendChild(n); pb.appendChild(pr);
    var q = cart[p.id] || 0;
    if (!q){
      var a = document.createElement("button"); a.className = "add"; a.type = "button"; a.textContent = "Savatga";
      a.onclick = function(){ setQty(p.id, 1); };
      pb.appendChild(a);
    } else {
      var s = document.createElement("div"); s.className = "step";
      var m = document.createElement("button"); m.type = "button"; m.textContent = "−"; m.setAttribute("aria-label","Kamaytirish"); m.onclick = function(){ setQty(p.id, q - 1); };
      var c = document.createElement("b"); c.textContent = q;
      var pl = document.createElement("button"); pl.type = "button"; pl.textContent = "+"; pl.setAttribute("aria-label","Ko'paytirish"); pl.onclick = function(){ setQty(p.id, q + 1); };
      s.appendChild(m); s.appendChild(c); s.appendChild(pl); pb.appendChild(s);
    }
    d.appendChild(ph); d.appendChild(pb); g.appendChild(d);
  });
}

function totals(){
  var cnt = 0, sum = 0;
  PRODUCTS.forEach(function(p){ var q = cart[p.id] || 0; cnt += q; sum += q * p.price; });
  return {cnt: cnt, sum: sum};
}

function setQty(id, q){
  if (q <= 0) delete cart[id]; else cart[id] = Math.min(q, 99);
  renderGrid(); renderBar();
}

function renderBar(){
  var t = totals();
  $("bar").className = "bar" + (t.cnt ? " on" : "");
  $("go").textContent = "Buyurtma berish · " + t.cnt + " ta · " + fmt(t.sum);
}

$("go").onclick = function(){
  var items = [];
  PRODUCTS.forEach(function(p){ if (cart[p.id]) items.push({n: p.name, q: cart[p.id], p: p.price}); });
  var data = JSON.stringify({o: items, t: totals().sum});
  if (tg && tg.sendData) tg.sendData(data);
  else alert("Buyurtmani faqat Telegram bot ichidagi Katalog tugmasi orqali yuborish mumkin.");
};

renderChips(); renderGrid(); renderBar();
</script>
</body>
</html>
